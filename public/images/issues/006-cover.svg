<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect x="80" y="60" width="1040" height="56" rx="10" fill="#18181b"/>
  <text x="600" y="96" font-family="monospace" font-size="18" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">WEEKLY ROUNDUP — APR 28, 2026</text>

  <!-- Story 1: China blocks Meta -->
  <rect x="80" y="140" width="490" height="190" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="80" y="140" width="490" height="8" rx="12" fill="#ef4444"/>
  <text x="104" y="178" font-family="monospace" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="1">GEOPOLITICS</text>
  <text x="104" y="204" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">China Blocks Meta's</text>
  <text x="104" y="224" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">Manus AI Acquisition</text>
  <text x="104" y="252" font-family="monospace" font-size="11" fill="#71717a">Beijing steps in to block US tech</text>
  <text x="104" y="268" font-family="monospace" font-size="11" fill="#71717a">from acquiring Chinese AI startup</text>
  <text x="104" y="284" font-family="monospace" font-size="11" fill="#71717a">as geopolitical rivalry intensifies.</text>
  <text x="104" y="310" font-family="monospace" font-size="10" fill="#a1a1aa">Al Jazeera · 1 day ago</text>

  <!-- Story 2: AI talent exodus -->
  <rect x="590" y="140" width="530" height="190" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="590" y="140" width="530" height="8" rx="12" fill="#f59e0b"/>
  <text x="614" y="178" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">STARTUPS</text>
  <text x="614" y="204" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">Big Tech Staff Are Leaving</text>
  <text x="614" y="224" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">to Build AI Startups</text>
  <text x="614" y="252" font-family="monospace" font-size="11" fill="#71717a">Ex-Meta, Google &amp; OpenAI employees</text>
  <text x="614" y="268" font-family="monospace" font-size="11" fill="#71717a">are raising hundreds of millions</text>
  <text x="614" y="284" font-family="monospace" font-size="11" fill="#71717a">within months of launching.</text>
  <text x="614" y="310" font-family="monospace" font-size="10" fill="#a1a1aa">CNBC · 17 hours ago</text>

  <!-- Story 3: BCI Neurable -->
  <rect x="80" y="350" width="490" height="190" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="80" y="350" width="490" height="8" rx="12" fill="#8b5cf6"/>
  <text x="104" y="388" font-family="monospace" font-size="11" font-weight="700" fill="#8b5cf6" letter-spacing="1">DEEP TECH</text>
  <text x="104" y="414" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">Mind-Reading Headphones</text>
  <text x="104" y="434" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">Coming to Consumers</text>
  <text x="104" y="462" font-family="monospace" font-size="11" fill="#71717a">Neurable is licensing its non-invasive</text>
  <text x="104" y="478" font-family="monospace" font-size="11" fill="#71717a">BCI tech for everyday wearables —</text>
  <text x="104" y="494" font-family="monospace" font-size="11" fill="#71717a">no surgery required.</text>
  <text x="104" y="520" font-family="monospace" font-size="10" fill="#a1a1aa">TechCrunch · 8 hours ago</text>

  <!-- Story 4: Tamber AI music -->
  <rect x="590" y="350" width="530" height="190" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="590" y="350" width="530" height="8" rx="12" fill="#10b981"/>
  <text x="614" y="388" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">FUNDING</text>
  <text x="614" y="414" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">Tamber Raises $5M for</text>
  <text x="614" y="434" font-family="monospace" font-size="15" font-weight="900" fill="#18181b">AI Music Tool</text>
  <text x="614" y="462" font-family="monospace" font-size="11" fill="#71717a">Adobe Ventures backs LA startup</text>
  <text x="614" y="478" font-family="monospace" font-size="11" fill="#71717a">building AI music tech designed to</text>
  <text x="614" y="494" font-family="monospace" font-size="11" fill="#71717a">extend — not replace — artists.</text>
  <text x="614" y="520" font-family="monospace" font-size="10" fill="#a1a1aa">Music Business Worldwide · 11 hours ago</text>
</svg>
