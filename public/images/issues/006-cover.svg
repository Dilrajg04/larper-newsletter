<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect x="200" y="44" width="800" height="50" rx="10" fill="#18181b"/>
  <text x="600" y="75" font-family="monospace" font-size="15" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">WEEKLY ROUNDUP — APR 28, 2026</text>

  <!-- Story 1: Geopolitics -->
  <rect x="210" y="114" width="780" height="100" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="114" width="6" height="100" rx="3" fill="#ef4444"/>
  <text x="232" y="142" font-family="monospace" font-size="10" font-weight="700" fill="#ef4444" letter-spacing="1">GEOPOLITICS</text>
  <text x="232" y="163" font-family="monospace" font-size="14" font-weight="900" fill="#18181b">China Blocks Meta's Manus AI Acquisition</text>
  <text x="232" y="183" font-family="monospace" font-size="11" fill="#71717a">Beijing steps in to stop US tech from buying Chinese AI startup as rivalry intensifies.</text>
  <text x="232" y="202" font-family="monospace" font-size="9" fill="#a1a1aa">Al Jazeera · 1 day ago</text>

  <!-- Story 2: Startups -->
  <rect x="210" y="226" width="780" height="100" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="226" width="6" height="100" rx="3" fill="#f59e0b"/>
  <text x="232" y="254" font-family="monospace" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1">STARTUPS</text>
  <text x="232" y="275" font-family="monospace" font-size="14" font-weight="900" fill="#18181b">Big Tech Staff Are Leaving to Build AI Startups</text>
  <text x="232" y="295" font-family="monospace" font-size="11" fill="#71717a">Ex-Meta, Google &amp; OpenAI employees raising hundreds of millions within months.</text>
  <text x="232" y="314" font-family="monospace" font-size="9" fill="#a1a1aa">CNBC · 17 hours ago</text>

  <!-- Story 3: Deep Tech -->
  <rect x="210" y="338" width="780" height="100" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="338" width="6" height="100" rx="3" fill="#8b5cf6"/>
  <text x="232" y="366" font-family="monospace" font-size="10" font-weight="700" fill="#8b5cf6" letter-spacing="1">DEEP TECH</text>
  <text x="232" y="387" font-family="monospace" font-size="14" font-weight="900" fill="#18181b">Mind-Reading Headphones Coming to Consumers</text>
  <text x="232" y="407" font-family="monospace" font-size="11" fill="#71717a">Neurable licenses non-invasive BCI tech for everyday wearables — no surgery needed.</text>
  <text x="232" y="426" font-family="monospace" font-size="9" fill="#a1a1aa">TechCrunch · 8 hours ago</text>

  <!-- Story 4: Funding -->
  <rect x="210" y="450" width="780" height="100" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="450" width="6" height="100" rx="3" fill="#10b981"/>
  <text x="232" y="478" font-family="monospace" font-size="10" font-weight="700" fill="#10b981" letter-spacing="1">FUNDING</text>
  <text x="232" y="499" font-family="monospace" font-size="14" font-weight="900" fill="#18181b">Tamber Raises $5M for AI Music Tool</text>
  <text x="232" y="519" font-family="monospace" font-size="11" fill="#71717a">Adobe Ventures backs LA startup building AI music tech to extend — not replace — artists.</text>
  <text x="232" y="538" font-family="monospace" font-size="9" fill="#a1a1aa">Music Business Worldwide · 11 hours ago</text>
</svg>
