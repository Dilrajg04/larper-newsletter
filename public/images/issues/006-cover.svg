<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Header bar — within safe zone x=200–1000 -->
  <rect x="200" y="52" width="800" height="52" rx="10" fill="#18181b"/>
  <text x="600" y="83" font-family="monospace" font-size="16" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">WEEKLY ROUNDUP — APR 28, 2026</text>

  <!-- Story 1: Geopolitics — left top -->
  <rect x="210" y="124" width="370" height="180" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="124" width="370" height="7" rx="10" fill="#ef4444"/>
  <text x="230" y="158" font-family="monospace" font-size="10" font-weight="700" fill="#ef4444" letter-spacing="1">GEOPOLITICS</text>
  <text x="230" y="180" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">China Blocks Meta's</text>
  <text x="230" y="198" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">Manus AI Acquisition</text>
  <text x="230" y="222" font-family="monospace" font-size="10" fill="#71717a">Beijing blocks US tech from buying</text>
  <text x="230" y="238" font-family="monospace" font-size="10" fill="#71717a">Chinese AI startup Manus as rivalry</text>
  <text x="230" y="254" font-family="monospace" font-size="10" fill="#71717a">between US and China intensifies.</text>
  <text x="230" y="292" font-family="monospace" font-size="9" fill="#a1a1aa">Al Jazeera · 1 day ago</text>

  <!-- Story 2: Startups — right top -->
  <rect x="620" y="124" width="370" height="180" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="620" y="124" width="370" height="7" rx="10" fill="#f59e0b"/>
  <text x="640" y="158" font-family="monospace" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1">STARTUPS</text>
  <text x="640" y="180" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">Big Tech Staff Are Leaving</text>
  <text x="640" y="198" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">to Build AI Startups</text>
  <text x="640" y="222" font-family="monospace" font-size="10" fill="#71717a">Ex-Meta, Google &amp; OpenAI employees</text>
  <text x="640" y="238" font-family="monospace" font-size="10" fill="#71717a">are raising hundreds of millions</text>
  <text x="640" y="254" font-family="monospace" font-size="10" fill="#71717a">within months of launching.</text>
  <text x="640" y="292" font-family="monospace" font-size="9" fill="#a1a1aa">CNBC · 17 hours ago</text>

  <!-- Story 3: Deep Tech — left bottom -->
  <rect x="210" y="324" width="370" height="180" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="210" y="324" width="370" height="7" rx="10" fill="#8b5cf6"/>
  <text x="230" y="358" font-family="monospace" font-size="10" font-weight="700" fill="#8b5cf6" letter-spacing="1">DEEP TECH</text>
  <text x="230" y="380" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">Mind-Reading Headphones</text>
  <text x="230" y="398" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">Coming to Consumers</text>
  <text x="230" y="422" font-family="monospace" font-size="10" fill="#71717a">Neurable licenses non-invasive BCI</text>
  <text x="230" y="438" font-family="monospace" font-size="10" fill="#71717a">tech for everyday wearables —</text>
  <text x="230" y="454" font-family="monospace" font-size="10" fill="#71717a">no surgery required.</text>
  <text x="230" y="492" font-family="monospace" font-size="9" fill="#a1a1aa">TechCrunch · 8 hours ago</text>

  <!-- Story 4: Funding — right bottom -->
  <rect x="620" y="324" width="370" height="180" rx="10" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="620" y="324" width="370" height="7" rx="10" fill="#10b981"/>
  <text x="640" y="358" font-family="monospace" font-size="10" font-weight="700" fill="#10b981" letter-spacing="1">FUNDING</text>
  <text x="640" y="380" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">Tamber Raises $5M for</text>
  <text x="640" y="398" font-family="monospace" font-size="13" font-weight="900" fill="#18181b">AI Music Tool</text>
  <text x="640" y="422" font-family="monospace" font-size="10" fill="#71717a">Adobe Ventures backs LA startup</text>
  <text x="640" y="438" font-family="monospace" font-size="10" fill="#71717a">building AI music tech designed to</text>
  <text x="640" y="454" font-family="monospace" font-size="10" fill="#71717a">extend — not replace — artists.</text>
  <text x="640" y="492" font-family="monospace" font-size="9" fill="#a1a1aa">Music Business Worldwide · 11 hours ago</text>
</svg>
