<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Spoke lines -->
  <line x1="600" y1="315" x2="390" y2="195" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="600" y2="160" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="810" y2="195" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="840" y2="315" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="740" y2="435" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="460" y2="435" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="360" y2="315" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>

  <!-- Center node -->
  <circle cx="600" cy="315" r="65" fill="#e6faf4" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="600" cy="315" r="46" fill="#d1f5ea" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="309" font-family="monospace" font-size="15" font-weight="900" fill="#059669" text-anchor="middle" letter-spacing="1">GPT-5</text>
  <text x="600" y="328" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">super app</text>

  <!-- Chat — top left -->
  <rect x="295" y="158" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="355" y="179" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">💬 Chat</text>
  <text x="355" y="196" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">conversation</text>

  <!-- Code — top center -->
  <rect x="540" y="110" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="600" y="131" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">💻 Code</text>
  <text x="600" y="148" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">write &amp; run</text>

  <!-- Images — top right -->
  <rect x="785" y="158" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="845" y="179" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🖼️ Images</text>
  <text x="845" y="196" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">generate &amp; read</text>

  <!-- Browse — right -->
  <rect x="848" y="291" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="908" y="312" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🌐 Browse</text>
  <text x="908" y="329" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">live web</text>

  <!-- Voice — bottom right -->
  <rect x="680" y="410" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="740" y="431" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🎙️ Voice</text>
  <text x="740" y="448" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">speak &amp; listen</text>

  <!-- Files — bottom left -->
  <rect x="400" y="410" width="120" height="48" rx="11" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="460" y="431" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">📎 Files</text>
  <text x="460" y="448" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">read any doc</text>

  <!-- Agents — left -->
  <rect x="232" y="291" width="120" height="48" rx="11" fill="#e6faf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="292" y="312" font-family="monospace" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">🤖 Agents</text>
  <text x="292" y="329" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">works for you</text>
</svg>
