<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
    <linearGradient id="center-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Spoke lines from center to each capability -->
  <line x1="600" y1="315" x2="320" y2="160" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="600" y2="110" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="880" y2="160" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="900" y2="360" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="740" y2="500" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="460" y2="500" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="600" y1="315" x2="300" y2="360" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>

  <!-- Center node — GPT-5 -->
  <circle cx="600" cy="315" r="70" fill="#e6faf4" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="600" cy="315" r="50" fill="#d1f5ea" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="308" font-family="monospace" font-size="15" font-weight="900" fill="#059669" text-anchor="middle" letter-spacing="1">GPT-5</text>
  <text x="600" y="328" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">super app</text>

  <!-- Capability: Chat -->
  <rect x="235" y="120" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="300" y="143" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">💬 Chat</text>
  <text x="300" y="161" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">conversation</text>

  <!-- Capability: Code -->
  <rect x="535" y="65" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="600" y="88" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">💻 Code</text>
  <text x="600" y="106" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">write &amp; run</text>

  <!-- Capability: Images -->
  <rect x="815" y="120" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="880" y="143" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🖼️ Images</text>
  <text x="880" y="161" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">generate &amp; read</text>

  <!-- Capability: Browse -->
  <rect x="835" y="330" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="900" y="353" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🌐 Browse</text>
  <text x="900" y="371" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">live web search</text>

  <!-- Capability: Voice -->
  <rect x="675" y="468" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="740" y="491" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">🎙️ Voice</text>
  <text x="740" y="509" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">speak &amp; listen</text>

  <!-- Capability: Files -->
  <rect x="395" y="468" width="130" height="52" rx="12" fill="white" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="460" y="491" font-family="monospace" font-size="12" fill="#52525b" text-anchor="middle" font-weight="600">📎 Files</text>
  <text x="460" y="509" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">read any doc</text>

  <!-- Capability: Agents -->
  <rect x="235" y="330" width="130" height="52" rx="12" fill="#e6faf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="353" font-family="monospace" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">🤖 Agents</text>
  <text x="300" y="371" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">works for you</text>
</svg>
